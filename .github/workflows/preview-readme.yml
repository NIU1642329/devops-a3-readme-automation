name: Preview README

on:
  pull_request:
    branches: [main]

permissions:
  contents: read              # read-only: the PAT is never exposed to PR code

jobs:
  preview:
    name: Preview (MAX_ITEMS=${{ matrix.max_items }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        max_items: [5, 10]    # compact vs. full layout
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50
      - name: Dry-run the generator
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          MAX_ITEMS: ${{ matrix.max_items }}
        run: python3 scripts/update_readme.py

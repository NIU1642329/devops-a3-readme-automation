name: Update README activity

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h at minute 17 (avoids the busy top of the hour)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]
    paths-ignore:             # the bot's own commits must not re-trigger this workflow
      - "README.md"
      - ".cache/**"

permissions:
  contents: read              # GITHUB_TOKEN stays read-only; writes use the scoped REPO_TOKEN

concurrency:
  group: update-readme        # never two runs editing the README at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail fast if REPO_TOKEN is missing
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::Repository secret REPO_TOKEN is not configured"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.REPO_TOKEN }}
          fetch-depth: 50     # lets the script recognise its own previous commits

      - name: Generate activity section
        id: gen
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          REPOS: ${{ vars.ACTIVITY_REPOS || github.repository }}
          MAX_ITEMS: "10"
          MAX_RETRIES: "4"
          BACKOFF_BASE: "2"
        run: python3 scripts/update_readme.py

      - name: Commit and push only if the README changed
        if: steps.gen.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .cache/activity.json
          git commit -m "docs(readme): refresh recent activity [skip ci]"
          git push
